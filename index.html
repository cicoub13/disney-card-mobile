<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#16206b" />
    <meta name="description" content="Scanne tes cartes Disney Leclerc 2026 avec l'appareil photo du téléphone et vois d'un coup d'œil celles qui te manquent. Gratuit, sans compte, hors ligne." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Album 108 · ta collection Disney Leclerc 2026" />
    <meta property="og:description" content="Scanne tes cartes avec l'appareil photo, vois celles qui manquent. Tout se passe sur le téléphone." />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:image" content="%VITE_SITE_URL%og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>Album 108 · Cartes Disney Leclerc 2026</title>
  </head>
  <body>
    <header class="top">
      <div class="stars" aria-hidden="true"></div>
      <div class="top-row">
        <h1 class="brand">
          <img src="icon.svg" alt="" width="32" height="32" />
          <span>Album 108<small>Disney Leclerc 2026</small></span>
        </h1>
        <button id="menu-btn" class="icon-btn" aria-label="Menu">⋯</button>
      </div>
      <div class="progress-row">
        <div class="progress"><div id="progress-bar"></div></div>
        <strong id="progress-pct"></strong>
      </div>
      <p id="progress-text"></p>
    </header>

    <main>
      <section id="view-collection">
        <div class="filters" role="tablist">
          <button data-filter="all" class="chip active"></button>
          <button data-filter="missing" class="chip"></button>
          <button data-filter="owned" class="chip"></button>
          <button data-filter="dupes" class="chip"></button>
        </div>
        <div id="grid"></div>
      </section>

      <section id="view-scan" hidden>
        <div class="camera">
          <video id="video" playsinline muted autoplay></video>
          <div id="card-frame" class="card-frame">
            <div id="number-zone" class="number-zone">
              <div class="scanline"></div>
              <div id="hits"></div>
            </div>
          </div>
          <div class="scan-banner">
            <img id="scan-thumb" class="scan-thumb" alt="" hidden />
            <div>
              <strong id="scan-title"></strong>
              <span id="scan-hint"></span>
              <span id="scan-dots" class="scan-dots"></span>
            </div>
          </div>
        </div>
        <form id="manual" class="manual">
          <input id="manual-num" type="number" inputmode="numeric" min="1" max="108" placeholder="N° de carte" />
          <button type="submit">OK</button>
        </form>
      </section>
    </main>

    <nav class="tabs">
      <button data-view="collection" class="active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7.5" height="10" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="10" rx="1.5"/><rect x="3" y="16" width="7.5" height="5" rx="1.5"/><rect x="13.5" y="16" width="7.5" height="5" rx="1.5"/></svg>
        Collection
      </button>
      <button data-view="scan">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M7 12h10"/></svg>
        Scanner
      </button>
    </nav>

    <dialog id="sheet" class="sheet">
      <div id="holo" class="holo">
        <img id="sheet-img" class="sheet-img" alt="" />
        <div class="holo-shine"></div>
      </div>
      <p id="sheet-info" class="sheet-info"></p>
      <div class="counter">
        <button id="sheet-minus" aria-label="Retirer un exemplaire">−</button>
        <span id="sheet-count"></span>
        <button id="sheet-plus" aria-label="Ajouter un exemplaire">+</button>
      </div>
      <div class="sheet-actions">
        <button id="sheet-add" class="primary">Ajouter à ma collection</button>
        <button id="sheet-close">Fermer</button>
      </div>
    </dialog>

    <dialog id="menu" class="sheet">
      <h2>Sauvegarde</h2>
      <p class="hint">La collection est enregistrée sur ce téléphone uniquement. Exporte-la de temps en temps.</p>
      <div class="sheet-actions">
        <button id="export-btn" class="primary">Exporter (JSON)</button>
        <label class="button">Importer (JSON)<input id="import-input" type="file" accept="application/json,.json" hidden /></label>
        <button id="clear-btn" class="danger">Vider la collection</button>
        <a class="button" href="https://www.collexstash.com/fr/collections/cards/cartes-disney-leclerc-2026" target="_blank" rel="noopener">Voir la collection sur Collexstash ↗</a>
        <a class="button" href="https://github.com/cicoub13/album-108" target="_blank" rel="noopener">Code source sur GitHub ↗</a>
        <button id="menu-close">Fermer</button>
      </div>
    </dialog>

    <canvas id="confetti" class="confetti" popover="manual" aria-hidden="true"></canvas>
    <div id="toast" class="toast" popover="manual" role="status"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
